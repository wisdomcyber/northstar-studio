steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "gcr.io/$PROJECT_ID/hostable-site:$SHORT_SHA", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "gcr.io/$PROJECT_ID/hostable-site:$SHORT_SHA"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - hostable-site
      - --image=gcr.io/$PROJECT_ID/hostable-site:$SHORT_SHA
      - --region=$LOCATION
      - --platform=managed
      - --allow-unauthenticated
      - --set-secrets=SMTP_USER=SMTP_USER:latest,SMTP_PASSWORD=SMTP_PASSWORD:latest,CONTACT_TO=CONTACT_TO:latest
images:
  - gcr.io/$PROJECT_ID/hostable-site:$SHORT_SHA
substitutions:
  LOCATION: us-central1
